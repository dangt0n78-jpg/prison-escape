<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Point & Click: Optical Escape</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-wrapper {
            position: relative;
            width: 800px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0,255,255,0.2);
        }
        canvas {
            display: block;
            cursor: none; /* Ẩn chuột mặc định để dùng kính lúp vẽ bằng code */
        }
        
        /* Giao diện Keypad (Point & Click popup) */
        #keypad-modal {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #1e293b;
            padding: 20px;
            border: 4px solid #334155;
            border-radius: 8px;
            text-align: center;
            z-index: 10;
        }
        #display-screen {
            background: #022c22;
            color: #34d399;
            font-size: 30px;
            letter-spacing: 10px;
            padding: 10px;
            margin-bottom: 15px;
            height: 40px;
            border-radius: 4px;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .btn-grid button {
            padding: 15px;
            font-size: 20px;
            background: #374151;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-grid button:hover { background: #4b5563; }
        .close-btn {
            margin-top: 15px;
            background: #ef4444 !important;
            width: 100%;
        }

        #hint {
            margin-top: 15px;
            color: #94a3b8;
            text-align: center;
        }
        kbd {
            background: #334155; padding: 2px 6px; border-radius: 4px; color: #38bdf8;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <!-- Bảng điều khiển ẩn -->
        <div id="keypad-modal">
            <div id="display-screen">___</div>
            <div class="btn-grid">
                <button onclick="pressKey(1)">1</button><button onclick="pressKey(2)">2</button><button onclick="pressKey(3)">3</button>
                <button onclick="pressKey(4)">4</button><button onclick="pressKey(5)">5</button><button onclick="pressKey(6)">6</button>
                <button onclick="pressKey(7)">7</button><button onclick="pressKey(8)">8</button><button onclick="pressKey(9)">9</button>
            </div>
            <button class="close-btn" onclick="closeKeypad()">ĐÓNG BẢNG ĐIỀU KHIỂN</button>
        </div>
    </div>

    <div id="hint">
        Rê chuột để soi kính lúp. Cuộn <kbd>Chuột giữa (Scroll)</kbd> để xoay kính.<br>
        Click chuột vào <b>Cửa chính</b> để nhập mã. Tìm 3 con số bị giấu bằng quang học!
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const keypadModal = document.getElementById('keypad-modal');
        const displayScreen = document.getElementById('display-screen');

        let mouseX = 400;
        let mouseY = 300;
        let lensAngle = 0; // Góc của kính lúp (0 - 180)
        let isKeypadOpen = false;
        let enteredCode = "";
        const CORRECT_CODE = "739";

        // Tọa độ các vật thể Point & Click
        const objects = {
            lcd: { x: 100, y: 200, w: 120, h: 90, type: 'lcd', polarization: 90, hiddenNum: '7' },
            puddle: { x: 400, y: 450, r: 60, type: 'glare', polarization: 0, hiddenNum: '3' },
            box: { x: 600, y: 250, w: 80, h: 120, type: 'birefringence', targetAngle: 45, hiddenNum: '9' },
            door: { x: 330, y: 80, w: 140, h: 250, type: 'door' }
        };

        // Lắng nghe chuột
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        canvas.addEventListener('wheel', (e) => {
            if(isKeypadOpen) return;
            e.preventDefault();
            lensAngle += e.deltaY > 0 ? -5 : 5;
            if (lensAngle >= 180) lensAngle -= 180;
            if (lensAngle < 0) lensAngle += 180;
        });

        // Click để tương tác
        canvas.addEventListener('mousedown', () => {
            if(isKeypadOpen) return;
            // Kiểm tra click vào cửa
            const d = objects.door;
            if (mouseX > d.x && mouseX < d.x + d.w && mouseY > d.y && mouseY < d.y + d.h) {
                isKeypadOpen = true;
                keypadModal.style.display = "block";
                document.body.style.cursor = "default";
            }
        });

        // Logic Keypad
        function pressKey(num) {
            if (enteredCode.length < 3) {
                enteredCode += num;
                displayScreen.innerText = enteredCode.padEnd(3, '_');
                if (enteredCode.length === 3) {
                    if (enteredCode === CORRECT_CODE) {
                        displayScreen.style.color = "#a3e635";
                        displayScreen.innerText = "SUCCESS";
                    } else {
                        displayScreen.style.color = "#ef4444";
                        setTimeout(() => { enteredCode = ""; displayScreen.innerText = "___"; displayScreen.style.color = "#34d399"; }, 800);
                    }
                }
            }
        }
        function closeKeypad() {
            isKeypadOpen = false;
            keypadModal.style.display = "none";
            document.body.style.cursor = "none";
        }

        function getAngleDiff(a, b) {
            let diff = Math.abs(a - b);
            if (diff > 90) diff = 180 - diff;
            return diff;
        }

        function render() {
            // --- 1. VẼ MÔI TRƯỜNG GỐC (Nhìn bằng mắt thường) ---
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Nền phòng
            ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Vẽ Cửa (Point & Click target)
            ctx.fillStyle = '#1e293b'; ctx.fillRect(objects.door.x, objects.door.y, objects.door.w, objects.door.h);
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 4; ctx.strokeRect(objects.door.x, objects.door.y, objects.door.w, objects.door.h);
            ctx.fillStyle = '#ef4444'; ctx.fillRect(objects.door.x + 100, objects.door.y + 120, 15, 20); // Bảng mã khóa
            
            // Vẽ màn hình LCD (Mắt thường thấy trắng xóa)
            ctx.fillStyle = '#f8fafc'; ctx.fillRect(objects.lcd.x, objects.lcd.y, objects.lcd.w, objects.lcd.h);
            
            // Vẽ vũng nước (Mắt thường thấy vệt chói sáng che lấp)
            ctx.beginPath(); ctx.ellipse(objects.puddle.x, objects.puddle.y, objects.puddle.r, objects.puddle.r/2, 0, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; ctx.fill();

            // Vẽ hộp nhựa (Mắt thường chỉ thấy hộp trong suốt hơi xám)
            ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(objects.box.x, objects.box.y, objects.box.w, objects.box.h);


            // --- 2. VẼ HIỆU ỨNG QUA KÍNH LÚP (Clipping Mask) ---
            if (!isKeypadOpen) {
                ctx.save();
                
                // Tạo một vùng mặt nạ (Mask) hình tròn tại con trỏ chuột
                ctx.beginPath();
                ctx.arc(mouseX, mouseY, 80, 0, Math.PI * 2);
                ctx.clip(); // Mọi lệnh vẽ tiếp theo CHỈ HIỂN THỊ bên trong hình tròn này

                // Đổ màu kính lúp (hơi xanh đen)
                ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // A. Xử lý màn hình LCD (Phát sáng ở 90 độ)
                // Càng xoay kính về 90 độ, màn hình càng tối dần (hấp thụ), để lộ chữ sáng bên dưới
                let diffLCD = getAngleDiff(lensAngle, objects.lcd.polarization); // lệch 0 -> 90
                let opacityLCD = Math.pow(Math.cos(diffLCD * Math.PI / 180), 2); // 1.0 đến 0.0
                
                ctx.fillStyle = `rgba(255, 255, 255, ${opacityLCD})`; // Nền chói
                ctx.fillRect(objects.lcd.x, objects.lcd.y, objects.lcd.w, objects.lcd.h);
                
                // Số ẩn (Chỉ hiện khi nền bớt chói - tức là opacityLCD thấp)
                ctx.fillStyle = `rgba(0, 255, 100, ${1 - opacityLCD})`;
                ctx.font = 'bold 50px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(objects.lcd.hiddenNum, objects.lcd.x + objects.lcd.w/2, objects.lcd.y + objects.lcd.h/2);

                // B. Xử lý vũng nước (Chói ở 0 độ)
                // Nước phân cực ngang (0 độ). Phải xoay kính 90 độ (vuông góc) để cắt chói.
                let diffWater = getAngleDiff(lensAngle, objects.puddle.polarization);
                let opacityWater = Math.pow(Math.cos(diffWater * Math.PI / 180), 2);
                
                // Số ẩn dưới đáy (Vẽ trước)
                ctx.fillStyle = '#cbd5e1'; ctx.font = 'bold 40px Arial';
                ctx.fillText(objects.puddle.hiddenNum, objects.puddle.x, objects.puddle.y);
                
                // Vẽ lớp chói đè lên (Sẽ biến mất nếu xoay đúng 90 độ)
                ctx.beginPath(); ctx.ellipse(objects.puddle.x, objects.puddle.y, objects.puddle.r, objects.puddle.r/2, 0, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255, 255, 255, ${opacityWater * 0.9})`; ctx.fill();

                // C. Xử lý hộp nhựa băng dính (Birefringence ở 45 độ)
                let diffBox = getAngleDiff(lensAngle, objects.box.targetAngle);
                let boxColorIntensity = 1 - (diffBox / 45); // Sáng nhất khi chênh lệch = 0
                if (boxColorIntensity > 0) {
                    ctx.fillStyle = `rgba(217, 70, 239, ${boxColorIntensity})`; // Màu tím
                    ctx.fillRect(objects.box.x + 10, objects.box.y + 40, 60, 40);
                    ctx.fillStyle = `rgba(255, 255, 255, ${boxColorIntensity})`;
                    ctx.font = 'bold 30px Arial';
                    ctx.fillText(objects.box.hiddenNum, objects.box.x + objects.box.w/2, objects.box.y + 60);
                }

                ctx.restore(); // Kết thúc vùng Mask kính lúp

                // --- 3. VẼ VIỀN VÀ TRỤC CỦA KÍNH LÚP ---
                ctx.beginPath();
                ctx.arc(mouseX, mouseY, 80, 0, Math.PI * 2);
                ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 4; ctx.stroke();
                
                // Vẽ vạch hiển thị góc xoay
                const rad = lensAngle * Math.PI / 180;
                ctx.beginPath();
                ctx.moveTo(mouseX - Math.cos(rad) * 90, mouseY - Math.sin(rad) * 90);
                ctx.lineTo(mouseX + Math.cos(rad) * 90, mouseY + Math.sin(rad) * 90);
                ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2; ctx.stroke();
                
                // Text góc
                ctx.fillStyle = '#fff'; ctx.font = '16px Arial'; ctx.textAlign = 'left';
                ctx.fillText(`${Math.round(lensAngle)}°`, mouseX + 90, mouseY - 10);
            }

            requestAnimationFrame(render);
        }

        // Bắt đầu loop
        render();
    </script>
</body>
</html>
